<!doctype html>
<html lang="en">
<head>

<title>ASHEN — The Hollow Room</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Marcellus&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d18;color:#f5e9d2;font-family:'DM Sans',sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.brand{position:fixed;left:28px;top:24px;z-index:2;pointer-events:none;color:#bfae9a;font:11px 'DM Mono',monospace;letter-spacing:.22em}.brand b{color:#e8a355;font-weight:500}.sound{position:fixed;right:26px;top:20px;z-index:3;border:1px solid #ffffff24;background:#17131eaa;color:#bfae9a;border-radius:20px;padding:8px 13px;font:10px 'DM Mono',monospace;letter-spacing:.1em;cursor:pointer}.sound:hover{color:#f5e9d2;border-color:#e8a35588}.touch-dash{display:none;position:fixed;right:26px;bottom:32px;width:62px;height:62px;border-radius:50%;border:1px solid #e8a35577;background:#231b29cc;color:#f0bb78;font:10px 'DM Mono',monospace;letter-spacing:.1em;z-index:3;touch-action:none}.touch-dash:active{background:#a14d37}
@media (pointer:coarse){.touch-dash{display:block}.brand{left:16px;top:14px}.sound{right:12px;top:12px}}
</style>

<body>
<canvas id="game" aria-label="Ashen game canvas"></canvas>
<div class="brand"><b>✦</b> ASHEN <span style="opacity:.55">/ THE HOLLOW ROOM</span></div>
<button class="sound" id="sound">♪ &nbsp; SOUND OFF</button>
<button class="touch-dash" id="dash">DASH</button>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const W=1280,H=720, keys={}, mouse={x:850,y:360,down:false};
let scale=1,ox=0,oy=0,state='menu',weapon='blade',player,enemies=[],shots=[],fx=[],time=0,last=0,spawned=0,kills=0,spawnTimer=0,shake=0,screenFade=0,choiceRects=[],soundOn=false,audio;
const weapons=[
 {id:'blade',name:'STYGIAN EDGE',type:'SWORD',desc:'Close, cruel, and quick.',detail:'A sweeping arc of iron.',color:'#ed9a56',icon:'⚔',damage:30,range:105,rate:.38},
 {id:'bow',name:'HEARTSEEKER',type:'BOW',desc:'Make distance your ally.',detail:'Piercing shots find their mark.',color:'#dd6873',icon:'➶',damage:24,range:520,rate:.52},
 {id:'staff',name:'WITCH’S ROD',type:'STAFF',desc:'A little chaos, at range.',detail:'Orbs burst into ember sparks.',color:'#8c8ee8',icon:'✧',damage:18,range:410,rate:.29}
];
function resize(){let dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2;ctx.setTransform(scale,0,0,scale,ox,oy)}
addEventListener('resize',resize);resize();
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(s,x,y,size,color='#f5e9d2',font='DM Sans',align='left'){ctx.fillStyle=color;ctx.font=`${size}px '${font}',sans-serif`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function pointer(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*devicePixelRatio/scale-ox/scale,y:(e.clientY-r.top)*devicePixelRatio/scale-oy/scale}}
function startGame(id){weapon=id;state='playing';player={x:640,y:390,r:17,hp:100,max:100,inv:0,attackCd:0,dashCd:0,dash:0,face:0};enemies=[];shots=[];fx=[];spawned=0;kills=0;spawnTimer=.25;for(let i=0;i<3;i++)spawnEnemy()}
function spawnEnemy(){if(spawned>=9)return;let edge=Math.floor(Math.random()*4),x=edge===0?135:edge===1?1145:220+Math.random()*840,y=edge===2?150:edge===3?570:180+Math.random()*380;let archer=spawned>2&&Math.random()<.30;enemies.push({x,y,r:archer?15:19,hp:archer?34:52,max:archer?34:52,type:archer?'wraith':'shade',speed:archer?58:72,cd:1+Math.random(),hit:0,phase:Math.random()*6});spawned++}
function attack(){if(state!=='playing'||player.attackCd>0)return;let w=weapons.find(a=>a.id===weapon);player.attackCd=w.rate;let angle=player.face;if(weapon==='blade'){for(let e of enemies){let dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx);if(d<w.range&&Math.abs(Math.atan2(Math.sin(a-angle),Math.cos(a-angle)))<.9){hitEnemy(e,w.damage);e.x+=Math.cos(a)*22;e.y+=Math.sin(a)*22}}burst(player.x+Math.cos(angle)*55,player.y+Math.sin(angle)*55,w.color,12);shake=5}else{shots.push({x:player.x+Math.cos(angle)*23,y:player.y+Math.sin(angle)*23,vx:Math.cos(angle)*(weapon==='bow'?590:430),vy:Math.sin(angle)*(weapon==='bow'?590:430),r:weapon==='bow'?5:9,damage:w.damage,color:w.color,life:1.35,player:true,kind:weapon});burst(player.x+Math.cos(angle)*24,player.y+Math.sin(angle)*24,w.color,5);if(soundOn)tone(weapon==='bow'?420:260,.045)}}
function hitEnemy(e,dmg){if(e.hp<=0)return;e.hp-=dmg;e.hit=.12;burst(e.x,e.y,e.type==='wraith'?'#d67986':'#ec8151',7);if(e.hp<=0){kills++;burst(e.x,e.y,'#f5ba70',18);if(Math.random()<.28)fx.push({x:e.x,y:e.y,type:'heal',life:7});}}
function burst(x,y,color,n){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=35+Math.random()*190;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.42,max:.7,color,r:1+Math.random()*3})}}
function tone(freq,dur){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function doDash(){if(state!=='playing'||player.dashCd>0)return;player.dashCd=1.05;player.dash=.18;player.inv=.3;let dx=(keys.KeyD?1:0)-(keys.KeyA?1:0),dy=(keys.KeyS?1:0)-(keys.KeyW?1:0);if(!dx&&!dy){dx=Math.cos(player.face);dy=Math.sin(player.face)}let d=Math.hypot(dx,dy)||1;player.dashX=dx/d;player.dashY=dy/d;burst(player.x,player.y,'#f3bc75',10)}
function update(dt){time+=dt;if(state!=='playing')return;let p=player;p.attackCd=Math.max(0,p.attackCd-dt);p.dashCd=Math.max(0,p.dashCd-dt);p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);if(touchMove){dx=touchMove.x;dy=touchMove.y}let mag=Math.hypot(dx,dy);if(mag){dx/=Math.max(1,mag);dy/=Math.max(1,mag)}let speed=p.dash?650:225;p.x+= (p.dash?p.dashX:dx)*speed*dt;p.y+=(p.dash?p.dashY:dy)*speed*dt;p.x=Math.max(94,Math.min(1186,p.x));p.y=Math.max(125,Math.min(620,p.y));p.face=Math.atan2(mouse.y-p.y,mouse.x-p.x);
 if(mouse.down)attack();
 spawnTimer-=dt;if(spawned<9&&spawnTimer<=0&&enemies.filter(e=>e.hp>0).length<5){spawnEnemy();spawnTimer=.82+Math.random()*.38}
 for(let e of enemies){if(e.hp<=0)continue;e.hit=Math.max(0,e.hit-dt);let vx=p.x-e.x,vy=p.y-e.y,d=Math.hypot(vx,vy)||1,a=Math.atan2(vy,vx);e.phase+=dt*3;if(e.type==='wraith'){if(d>270){e.x+=vx/d*e.speed*dt;e.y+=vy/d*e.speed*dt}e.cd-=dt;if(e.cd<=0&&d<490){e.cd=2.1;shots.push({x:e.x,y:e.y,vx:vx/d*225,vy:vy/d*225,r:7,damage:12,color:'#ce7785',life:2,player:false});burst(e.x,e.y,'#ce7785',4)}}else if(d>p.r+e.r+16){e.x+=vx/d*e.speed*dt;e.y+=vy/d*e.speed*dt}else if(e.cd<=0){e.cd=.85;e.x-=vx/d*16;e.y-=vy/d*16;if(p.inv<=0){p.hp-=10;p.inv=.52;shake=8;burst(p.x,p.y,'#e56b60',10);if(soundOn)tone(100,.12)}}e.cd-=dt;e.x=Math.max(95,Math.min(1185,e.x));e.y=Math.max(130,Math.min(615,e.y))}
 for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.player){for(let e of enemies){if(e.hp>0&&Math.hypot(s.x-e.x,s.y-e.y)<s.r+e.r){hitEnemy(e,s.damage);s.life=0;if(s.kind==='staff')for(let other of enemies)if(other!==e&&other.hp>0&&Math.hypot(other.x-e.x,other.y-e.y)<68)hitEnemy(other,10);break}}}else if(p.inv<=0&&Math.hypot(s.x-p.x,s.y-p.y)<s.r+p.r){s.life=0;p.hp-=s.damage;p.inv=.5;shake=7;burst(p.x,p.y,'#e56b60',8)}}
 shots=shots.filter(s=>s.life>0&&s.x>35&&s.x<1245&&s.y>50&&s.y<680);enemies=enemies.filter(e=>e.hp>0);for(let f of fx){f.life-=dt;if(f.vx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.96;f.vy*=.96}if(f.type==='heal'&&Math.hypot(f.x-p.x,f.y-p.y)<25){p.hp=Math.min(p.max,p.hp+15);f.life=0;burst(f.x,f.y,'#91d5a5',9)}}fx=fx.filter(f=>f.life>0);shake=Math.max(0,shake-dt*28);
 if(p.hp<=0){state='dead';mouse.down=false}if(spawned>=9&&enemies.length===0){state='won';mouse.down=false}
}
function draw(){ctx.setTransform(scale,0,0,scale,ox,oy);ctx.clearRect(-ox/scale,-oy/scale,innerWidth,innerHeight);ctx.fillStyle='#100d18';ctx.fillRect(0,0,W,H);ctx.save();if(shake){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}drawRoom();if(state==='menu')drawMenu();else{drawActors();drawHud();if(state==='dead'||state==='won')drawEnd()}ctx.restore();requestAnimationFrame(frame)}
function drawRoom(){// shadowed chamber floor
 let g=ctx.createRadialGradient(640,365,45,640,365,650);g.addColorStop(0,'#29212b');g.addColorStop(.65,'#201923');g.addColorStop(1,'#14111b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // carved stone floor
 for(let y=142;y<660;y+=64)for(let x=90+(Math.floor(y/64)%2)*32;x<1210;x+=64){ctx.strokeStyle='#c9a67c0b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+64,y);ctx.lineTo(x+64,y+64);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+64);ctx.stroke()}
 // perimeter
 ctx.strokeStyle='#b0785360';ctx.lineWidth=2;rounded(66,108,1148,564,14);ctx.stroke();ctx.strokeStyle='#f0bd7d30';ctx.lineWidth=1;rounded(74,116,1132,548,11);ctx.stroke();
 // entrance / engraved circle
 for(let r=34;r<=76;r+=14){ctx.beginPath();ctx.arc(640,390,r,0,Math.PI*2);ctx.strokeStyle=r===76?'#d18b5630':'#d18b5618';ctx.lineWidth=1;ctx.stroke()}for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.beginPath();ctx.arc(640+61*Math.cos(a),390+61*Math.sin(a),4,0,Math.PI*2);ctx.fillStyle='#dca16b50';ctx.fill()}
 // wall braziers
 for(let x of [115,1165]){ctx.fillStyle='#16111a';rounded(x-22,140,44,74,8);ctx.fill();ctx.beginPath();ctx.arc(x,164,9+Math.sin(time*5+x)*2,0,Math.PI*2);ctx.fillStyle='#f39b50';ctx.shadowColor='#f17736';ctx.shadowBlur=24;ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(x,164,3,0,Math.PI*2);ctx.fillStyle='#ffe5a0';ctx.fill()}
}
function drawActors(){for(let s of shots){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.atan2(s.vy,s.vx));ctx.shadowColor=s.color;ctx.shadowBlur=14;if(s.player&&s.kind==='bow'){ctx.fillStyle=s.color;ctx.fillRect(-12,-2,25,4);ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(7,-5);ctx.lineTo(7,5);ctx.fill()}else{ctx.beginPath();ctx.arc(0,0,s.r,0,Math.PI*2);ctx.fillStyle=s.color;ctx.fill();ctx.beginPath();ctx.arc(-2,-2,s.r*.4,0,Math.PI*2);ctx.fillStyle='#fff0d6';ctx.fill()}ctx.restore()}
 for(let e of enemies)drawEnemy(e);for(let f of fx){ctx.globalAlpha=Math.min(1,f.life*2);if(f.type==='heal'){ctx.fillStyle='#80cc93';ctx.shadowColor='#80cc93';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(f.x,f.y,8,0,Math.PI*2);ctx.fill();text('+',f.x,f.y+5,13,'#fff','DM Mono','center');ctx.shadowBlur=0}else{ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(f.life/f.max+.2),0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;
 if(player){let p=player;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.face);if(p.inv>0)ctx.globalAlpha=.5+Math.sin(time*40)*.3;ctx.shadowColor='#ed9a56';ctx.shadowBlur=24;ctx.beginPath();ctx.ellipse(0,8,17,8,0,0,Math.PI*2);ctx.fillStyle='#08070d';ctx.fill();ctx.shadowBlur=0;
 // cloak/body
 ctx.fillStyle='#493044';ctx.beginPath();ctx.moveTo(-12,-4);ctx.quadraticCurveTo(-23,10,-16,23);ctx.lineTo(8,21);ctx.quadraticCurveTo(20,8,12,-7);ctx.closePath();ctx.fill();ctx.fillStyle='#cc7455';ctx.beginPath();ctx.arc(1,-2,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#efc08b';ctx.beginPath();ctx.arc(6,-6,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#241a26';ctx.beginPath();ctx.ellipse(4,-9,10,5,-.4,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#f3ddbd';ctx.beginPath();ctx.arc(9,-5,1.5,0,Math.PI*2);ctx.fill();
 if(weapon==='blade'){ctx.save();ctx.rotate(.2);ctx.fillStyle='#dfbd91';ctx.fillRect(11,-2,25,4);ctx.fillStyle='#f8e2bb';ctx.beginPath();ctx.moveTo(35,-2);ctx.lineTo(47,0);ctx.lineTo(35,2);ctx.fill();ctx.fillStyle='#815743';ctx.fillRect(10,-5,4,10);ctx.restore()}else if(weapon==='bow'){ctx.strokeStyle='#e6ac72';ctx.lineWidth=2;ctx.beginPath();ctx.arc(19,0,16,-1.15,1.15);ctx.stroke();line(24,-14,24,14,'#dbc5a0',1)}else{ctx.strokeStyle='#9a91e8';ctx.lineWidth=3;line(15,9,37,-12,'#9a91e8',3);ctx.beginPath();ctx.arc(38,-13,4,0,Math.PI*2);ctx.fillStyle='#b8afff';ctx.shadowColor='#9a91e8';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0}
 ctx.restore();}
}
function drawEnemy(e){let bob=Math.sin(time*4+e.phase)*2;ctx.save();ctx.translate(e.x,e.y+bob);ctx.shadowColor=e.type==='wraith'?'#d36074':'#b8513b';ctx.shadowBlur=15;ctx.globalAlpha=e.hit>0?.55:1;if(e.type==='shade'){ctx.fillStyle='#542a34';ctx.beginPath();ctx.moveTo(-17,10);ctx.quadraticCurveTo(-26,-6,-12,-20);ctx.quadraticCurveTo(0,-29,14,-16);ctx.quadraticCurveTo(22,-6,16,10);ctx.lineTo(22,20);ctx.lineTo(-18,20);ctx.closePath();ctx.fill();ctx.fillStyle='#ed9b65';ctx.beginPath();ctx.ellipse(-6,-5,2.7,4,0,0,Math.PI*2);ctx.ellipse(7,-5,2.7,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff0ce';ctx.beginPath();ctx.ellipse(-6,-5,1,2.3,0,0,Math.PI*2);ctx.ellipse(7,-5,1,2.3,0,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#55374d';ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a86c97';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,20,-2,2);ctx.stroke();ctx.fillStyle='#efb1c2';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c88a9d';ctx.lineWidth=1;line(-11,-17,-18,-28,'#c88a9d',2);line(10,-17,17,-28,'#c88a9d',2)}ctx.shadowBlur=0;ctx.globalAlpha=1;if(e.hp<e.max){ctx.fillStyle='#160f17';rounded(-16,-32,32,4,2);ctx.fill();ctx.fillStyle='#e9846e';rounded(-16,-32,32*Math.max(0,e.hp/e.max),4,2);ctx.fill()}ctx.restore()}
function drawHud(){let w=weapons.find(a=>a.id===weapon);ctx.fillStyle='#120e18d9';rounded(38,34,276,66,8);ctx.fill();ctx.strokeStyle='#ffffff16';rounded(38,34,276,66,8);ctx.stroke();text('VITALITY',55,54,10,'#bba995','DM Mono');rounded(55,66,220,10,5);ctx.fillStyle='#33222a';ctx.fill();if(player.hp>0){let grad=ctx.createLinearGradient(55,0,275,0);grad.addColorStop(0,'#cf614f');grad.addColorStop(1,'#edaa68');rounded(55,66,220*player.hp/player.max,10,5);ctx.fillStyle=grad;ctx.fill()}text(`${Math.ceil(player.hp)} / ${player.max}`,287,78,11,'#e9d8c2','DM Mono','right');text(`${w.icon}  ${w.name}`,55,91,10,w.color,'DM Mono');
 ctx.textAlign='center';text('THE HOLLOW ROOM',640,47,11,'#cbb9a5','DM Mono','center');text(kills===9?'ROOM SECURED':`WAVE  I   ·   ${kills} / 9`,640,68,10,kills===9?'#e8a355':'#9b8b7b','DM Mono','center');
 ctx.textAlign='right';text('✦  '+Math.max(0,9-kills),1218,48,13,'#e9b875','DM Mono','right');text('SOULS',1218,65,9,'#9b8b7b','DM Mono','right');
 // controls tip
 if(time<9){ctx.fillStyle='#17121bbd';rounded(445,630,390,34,17);ctx.fill();text('WASD MOVE     ·     MOUSE ATTACK     ·     SPACE DASH',640,652,10,'#c5b5a2','DM Mono','center')}
}
function drawMenu(){ctx.fillStyle='#0c0910c9';ctx.fillRect(0,0,W,H); // ambient glows
 let gr=ctx.createRadialGradient(640,320,20,640,320,480);gr.addColorStop(0,'#9d57301c');gr.addColorStop(1,'#100d1800');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 text('A DESCENT INTO THE UNDERWORLD',640,140,11,'#d8955e','DM Mono','center');text('ASHEN',640,217,72,'#f1dfc4','Marcellus','center');text('ONE ROOM. THREE WAYS OUT.',640,251,12,'#b8a797','DM Mono','center');line(568,273,712,273,'#cf8c5c70',1);
 text('CHOOSE YOUR INSTRUMENT',640,315,12,'#d7c8b7','DM Mono','center');choiceRects=[];let cardW=266,gap=20,total=cardW*3+gap*2,start=640-total/2;
 weapons.forEach((w,i)=>{let x=start+i*(cardW+gap),y=345,active=weapon===w.id;choiceRects.push({x,y,w:cardW,h:205,id:w.id});ctx.fillStyle=active?'#30232a':'#1c1720';rounded(x,y,cardW,205,8);ctx.fill();ctx.strokeStyle=active?w.color+'b0':'#b79a7b3b';ctx.lineWidth=active?1.5:1;rounded(x,y,cardW,205,8);ctx.stroke();ctx.fillStyle=w.color;ctx.globalAlpha=.16;ctx.beginPath();ctx.arc(x+cardW/2,y+56,34,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;text(w.icon,x+cardW/2,y+68,33,w.color,'DM Sans','center');text(w.type,x+cardW/2,y+111,10,'#9f8c7d','DM Mono','center');text(w.name,x+cardW/2,y+135,16,'#f0dfc8','Marcellus','center');text(w.desc,x+cardW/2,y+161,11,'#b4a495','DM Sans','center');text(w.detail,x+cardW/2,y+180,10,'#84776e','DM Sans','center');if(active){text('EQUIPPED',x+cardW/2,y+222,9,w.color,'DM Mono','center')}});
 ctx.fillStyle='#d9955d';rounded(526,601,228,48,24);ctx.fill();text('ENTER THE ROOM',640,631,12,'#21161b','DM Mono','center');text('A quiet chamber waits. It will not stay quiet.',640,680,11,'#82766f','DM Sans','center');
}
function drawEnd(){ctx.fillStyle='#0b0810b8';ctx.fillRect(0,0,W,H);let win=state==='won';text(win?'THE ROOM IS QUIET':'THE DARK TAKES YOU',640,292,13,win?'#e9ae69':'#d87974','DM Mono','center');text(win?'A WORTHY BEGINNING.':'EVERY ENDING IS A DOOR.',640,349,38,'#f1dfc4','Marcellus','center');text(win?`You felled ${kills} shades. The night remembers.`:'The shades return to the dark. You can try again.',640,389,14,'#b6a595','DM Sans','center');ctx.fillStyle='#d9955d';rounded(534,444,212,48,24);ctx.fill();text('PLAY AGAIN',640,474,12,'#21161b','DM Mono','center');text('OR PRESS ENTER',640,522,10,'#9b8b7b','DM Mono','center')}
let touchMove=null,joyPointer=null,attackPointer=null;
canvas.addEventListener('pointermove',e=>{let p=pointer(e);mouse.x=p.x;mouse.y=p.y;if(joyPointer===e.pointerId&&touchMove){let dx=p.x-touchMove.ox,dy=p.y-touchMove.oy,d=Math.hypot(dx,dy),max=62;touchMove.x=dx/Math.max(max,d);touchMove.y=dy/Math.max(max,d)}});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);let p=pointer(e);mouse.x=p.x;mouse.y=p.y;if(state==='menu'){for(let r of choiceRects)if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h)weapon=r.id;if(p.x>=526&&p.x<=754&&p.y>=601&&p.y<=649){startGame(weapon)}return}if(state==='dead'||state==='won'){startGame(weapon);return}if(e.pointerType==='touch'&&p.x<640){joyPointer=e.pointerId;touchMove={ox:p.x,oy:p.y,x:0,y:0}}else{attackPointer=e.pointerId;mouse.down=true;attack()}});
canvas.addEventListener('pointerup',e=>{if(joyPointer===e.pointerId){joyPointer=null;touchMove=null}if(attackPointer===e.pointerId){attackPointer=null;mouse.down=false}});canvas.addEventListener('pointercancel',e=>{if(joyPointer===e.pointerId){joyPointer=null;touchMove=null}if(attackPointer===e.pointerId){attackPointer=null;mouse.down=false}});
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')doDash();if(state==='menu'){if(e.code==='Digit1')weapon='blade';if(e.code==='Digit2')weapon='bow';if(e.code==='Digit3')weapon='staff';if(e.code==='Enter')startGame(weapon)}else if((state==='dead'||state==='won')&&e.code==='Enter')startGame(weapon)});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{for(let k in keys)keys[k]=false;mouse.down=false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());document.querySelector('#dash').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();doDash()});document.querySelector('#sound').addEventListener('click',()=>{soundOn=!soundOn;document.querySelector('#sound').innerHTML=soundOn?'♪ &nbsp; SOUND ON':'♪ &nbsp; SOUND OFF';if(soundOn)tone(520,.08)});
function frame(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw()}requestAnimationFrame(frame);
</script>
</body>
</html>
